# CI de Raiden (docs/14-devops.md). Corre en cada PR y en push a main.
# No despliega: Cloudflare Pages construye desde el push a main (integración Git).
# Política de seguridad (docs/10-security.md §7, auditoría 2026-11-08): permisos mínimos, sin secretos,
# npm ci con lockfile y SIEMPRE --ignore-scripts (ninguna dependencia de producción necesita scripts de
# instalación: sharp usa binarios opcionales por plataforma y esbuild resuelve @esbuild/<plataforma>),
# actions fijadas por SHA completo (el tag va en el comentario para saber qué versión es).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Astro 7.4 exige Node >= 22.23.4 (su CLI sale con error en versiones anteriores): mismo valor en .nvmrc,
  # engines de package.json y NODE_VERSION de Cloudflare Pages.
  NODE_VERSION: 22.23.4
  # Solo variables PUBLIC_*; ninguna es secreta.
  PUBLIC_SITE_URL: https://ci.raiden.invalid
  PUBLIC_WHATSAPP_NUMBER: "51987654321"
  PUBLIC_ANALYTICS: ""

jobs:
  check:
    name: astro check + audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Bloqueante para vulnerabilidades high/critical (docs/10-security.md §7).
      - run: npm audit --audit-level=high
      - run: npx astro check
      # Pages Functions del panel de administración (functions/, ADR-018): proyecto TS propio con tipos de Workers.
      - run: npm run check:functions
      # Guardarraíl: el número de WhatsApp solo puede vivir en src/config/site.ts (valor por defecto).
      - name: No hay teléfonos ni secretos hardcodeados
        run: |
          set -euo pipefail
          hits=$(grep -rnE "\+51[0-9 ]{9,12}|\b51?9[0-9]{8}\b|api[_-]?key|secret|service_role|sk_live" src public --include='*' \
            | grep -v '^src/config/site.ts' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::Posible secreto o número hardcodeado"; exit 1; fi
      # Las actions deben ir fijadas por SHA completo y npm ci siempre con --ignore-scripts (cadena de suministro).
      - name: Workflows fijados por SHA y sin scripts de instalación
        run: |
          set -euo pipefail
          bad=$(grep -nE "^\s*-?\s*uses:\s*[^#]*@" .github/workflows/*.yml | grep -vE "@[0-9a-f]{40}\b" || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "::error::Action sin fijar por SHA de 40 caracteres"; exit 1; fi
          scripts=$(grep -nE "npm ci(\s|$)" .github/workflows/*.yml | grep -v -- "--ignore-scripts" || true)
          if [ -n "$scripts" ]; then echo "$scripts"; echo "::error::npm ci sin --ignore-scripts"; exit 1; fi

  unit:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run --passWithNoTests

  build:
    name: astro build
    needs: [check, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validar integridad del catálogo (git como CMS)
        run: npm run validate:content
      - run: npm run build
      - name: Presupuestos de rendimiento (JS/CSS/HTML gzip por página)
        run: npm run perf:budget
      - name: Validar JSON-LD (schema.org)
        run: npm run check:jsonld
      - name: Comprobar ficheros de hosting y ausencia de secretos en dist
        run: |
          set -euo pipefail
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/og-default.png
          # build.format 'file': las rutas sin barra existen como fichero (Cloudflare Pages las sirve con 200, sin 308)
          test -f dist/productos.html
          test -f dist/bicimotos/golden-eagle.html
          if grep -rIlE "SUPABASE_SERVICE|service_role|sk_live|Bearer [A-Za-z0-9._-]{20,}" dist; then
            echo "::error::Secreto detectado en dist/"; exit 1; fi
      # Astro inlina el runtime de islas y los <script> pequeños; la CSP los autoriza por hash
      # (sin 'unsafe-inline'). Si cambia Astro o un <script> de componente, este paso falla y
      # muestra los hashes que faltan para actualizar public/_headers y vercel.json.
      - name: "CSP: hashes de scripts inline"
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const csp = fs.readFileSync('dist/_headers', 'utf8').match(/Content-Security-Policy:\s*(.*)/)[1];
          const allowed = new Set([...csp.matchAll(/'(sha256-[^']+)'/g)].map(m => m[1]));
          const missing = new Map();
          (function walk(d) { for (const f of fs.readdirSync(d)) { const p = path.join(d, f);
            if (fs.statSync(p).isDirectory()) walk(p); else if (p.endsWith('.html')) {
              const html = fs.readFileSync(p, 'utf8'); const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/g; let m;
              while ((m = re.exec(html))) { if (/\bsrc=/.test(m[1]) || /ld\+json/.test(m[1])) continue;
                const h = 'sha256-' + crypto.createHash('sha256').update(m[2], 'utf8').digest('base64');
                if (!allowed.has(h)) missing.set(h, p + ' :: ' + m[2].slice(0, 60).replace(/\s+/g, ' ')); } } } })('dist');
          if (missing.size) { for (const [h, w] of missing) console.log(`'${h}'  <- ${w}`);
            console.log('::error::Scripts inline sin hash en la CSP de public/_headers (y vercel.json)'); process.exit(1); }
          console.log(`OK: ${allowed.size} hashes en CSP cubren todos los scripts inline de dist/`);
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: playwright + axe
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Playwright
        if: ${{ hashFiles('playwright.config.*') != '' }}
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: lighthouse ci
    needs: build
    # Solo PR y main; bloqueante en ambos (presupuestos en .lighthouserc.json).
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    continue-on-error: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      # Versión exacta: nada flotante se ejecuta en CI.
      - run: npx --yes @lhci/cli@0.16.0 autorun --config=.lighthouserc.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
